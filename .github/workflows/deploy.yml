name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main  # Despliega automáticamente cuando hay push a la rama main
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  deploy:
    name: 🚀 Deploy to cPanel
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: La carpeta dist no existe"
            exit 1
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "❌ Error: La carpeta dist está vacía"
            exit 1
          fi
          echo "✅ Build verificado exitosamente"
          ls -la dist/

      - name: 📤 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH || '/public_html/' }}
          local-dir: ./dist/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/*.log
          log-level: minimal
          security: loose

      - name: ✅ Deployment complete
        if: success()
        run: |
          echo "🎉 ==========================================="
          echo "   ¡Deploy successful!"
          echo "🎉 ==========================================="
          echo ""
          echo "🌐 Visit your site"
          echo ""

      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ ==========================================="
          echo "   Deployment failed!"
          echo "❌ ==========================================="
          echo ""
          echo "🔍 Check:"
          echo "   • FTP credentials in GitHub Secrets"
          echo "   • FTP server is accessible"
          echo "   • Write permissions on server"
          echo ""
          exit 1
